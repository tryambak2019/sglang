name: Build PR 42780 Mooncake dependency image

on:
  push:
    branches:
      - validation/pr42780-mooncake-image
    paths:
      - validation/mooncake-pr42780.Dockerfile
      - validation/mooncake-sm100.patch
      - validation/pr42780-native-inputs.txt
      - .github/workflows/build-mooncake-pr42780.yml
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write

concurrency:
  group: pr42780-mooncake-image
  cancel-in-progress: false

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/sglang-pr42780-recovery
  IMAGE_TAG: pr42780-31a9275-mooncake-1c54e233-sm100

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out validation branch
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push immutable dependency image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: validation/mooncake-pr42780.Dockerfile
          target: runtime-reuse-mooncake-and-treecore
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.IMAGE_NAME }}:${{ github.sha }}
          provenance: mode=max
          sbom: true
          build-args: |
            REUSED_RUNTIME_IMAGE=ghcr.io/tryambak2019/sglang-pr42780-recovery@sha256:d62346c2b91b261398c0fb203d72f97186477c03dbf6ed6eba5746630813ae78
            REUSED_RUNTIME_IMAGE_DIGEST=sha256:d62346c2b91b261398c0fb203d72f97186477c03dbf6ed6eba5746630813ae78
            SGLANG_PR_COMMIT=31a9275785295336a36961604772deccdd92a982
            SGLANG_PR_ARCHIVE_SHA256=7c0bc56456fd6c144711f89d99db174c28d4d649a7bf0ef5b55efaf95eba7051
            NATIVE_ARTIFACT_SOURCE_COMMIT=516b449c4a6a2f5e7a1099ada6207ad4347be909
            NATIVE_ARTIFACT_SHA256=21f2f46c2cf958139b6ea52746da84bfb43cd535850a9073336cf773aa3f981c
            NATIVE_INPUTS_SHA256=be7b35636f853e8917c2c5185bc04b6737d1d84c1b3eaddc6c4be84d6cda93f1

      - name: Resolve the runnable amd64 manifest digest
        id: digest
        shell: bash
        env:
          INDEX_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          image_ref="${IMAGE_NAME}@${INDEX_DIGEST}"
          manifest="$(docker buildx imagetools inspect "$image_ref" --raw)"
          amd64_digest="$(jq -r '
            if has("manifests") then
              [.manifests[]
                | select(.platform.os == "linux")
                | select(.platform.architecture == "amd64")
                | select((.annotations["vnd.docker.reference.type"] // "") != "attestation-manifest")
                | .digest][0] // empty
            else empty end
          ' <<<"$manifest")"
          if [[ -z "$amd64_digest" ]]; then
            amd64_digest="$INDEX_DIGEST"
          fi
          [[ "$amd64_digest" =~ ^sha256:[0-9a-f]{64}$ ]]
          echo "amd64_digest=$amd64_digest" >> "$GITHUB_OUTPUT"
          {
            echo '## Julien run inputs'
            echo
            echo '```bash'
            echo "SGLANG_IMAGE=${IMAGE_NAME}@${amd64_digest}"
            echo "EXPECTED_IMAGE_ID=${amd64_digest}"
            echo '```'
            echo
            echo "Build index digest: \`${INDEX_DIGEST}\`"
            echo "Reused full runtime: \`ghcr.io/tryambak2019/sglang-pr42780-recovery@sha256:d62346c2b91b261398c0fb203d72f97186477c03dbf6ed6eba5746630813ae78\`"
            echo "Mooncake commit: \`1c54e233a22404692efd312739db749991d8d757\`"
            echo "PR commit: \`31a9275785295336a36961604772deccdd92a982\`"
            echo "Reused TreeCore producing commit: \`516b449c4a6a2f5e7a1099ada6207ad4347be909\`"
            echo "Mooncake CUDA architecture: \`100-real\`"
            echo "SGLang base digest: \`sha256:e20a28a4badee7d3de71881e7c2c160c7079465bf1ac21edec31a99c2602507d\`"
          } >> "$GITHUB_STEP_SUMMARY"
